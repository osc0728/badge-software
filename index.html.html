<!DOCTYPE html>
<html>
<head>
    <title>Staff Badge Portal</title>
    <style>
        /* CSS: This handles the layout and the look of the badge */
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* This is the live preview "Badge" */
        #badge-preview {
            width: 300px;
            height: 450px;
            border: 2px solid #333;
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            position: relative;
        }

        #org-logo { width: 100px; margin-top: 30px; border-radius: 50%; background: #eee; height: 100px; display: flex; align-items: center; justify-content: center; }
        #display-name { margin-top: 50px; font-size: 24px; font-weight: bold; color: #1a1a1a; }
        #display-title { font-size: 18px; color: #666; margin-top: 5px; }
        
        .input-group { display: flex; flex-direction: column; gap: 10px; width: 300px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Staff Badge Creator</h2>
        
        <div id="badge-preview">
            <div id="org-logo">LOGO</div>
            <div id="display-name">STAFF NAME</div>
            <div id="display-title">Job Title</div>
            <div style="position: absolute; bottom: 20px; font-size: 12px; color: #999;">Authorized Personnel Only</div>
        </div>

        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Enter Full Name" oninput="updateBadge()">
            <input type="text" id="titleInput" placeholder="Enter Job Title" oninput="updateBadge()">
            <button onclick="window.print()">Print Badge</button>
        </div>
    </div>

    <script>
        /* Single language logic: Updates the preview as you type */
        function updateBadge() {
            const name = document.getElementById('nameInput').value;
            const title = document.getElementById('titleInput').value;
            
            document.getElementById('display-name').innerText = name.toUpperCase() || "STAFF NAME";
            document.getElementById('display-title').innerText = title || "Job Title";
        }
    </script>

</body>
</html>
